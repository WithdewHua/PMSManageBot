# 领域 repository 按子主题拆分的审阅计划（tasks 2.3，design D1 的表）。
#
# 每个计划登记：源文件、拆出的 mixin 模块与类名、留在门面类里的成员，
# 以及逐符号的目标模块。已进 mapping.toml 的成员同时登记 planned_target，
# 脚本会要求两处一致（`schedule_blackjack_split` 之外的任何搬移都不许发生）。

[blackjack_repository]
package = "app.domains.blackjack.repository"
facade = "_BlackjackRepositoryImplementation"
facade_bases = ["SystemConfigRepository"]
facade_members = ["award_or_renew_badge"]
sources = [
    "part_1.py",
    "part_2.py",
    "part_3.py",
    "part_4.py",
    "part_5.py",
    "part_6.py",
    "part_7.py",
]

[blackjack_repository.mixins]
hands = "_BlackjackRepositoryHands"
settlement = "_BlackjackRepositorySettlement"
jackpot = "_BlackjackRepositoryJackpot"
retention = "_BlackjackRepositoryRetention"
wallet = "_BlackjackRepositoryWallet"
stats = "_BlackjackRepositoryStats"
tournaments = "_BlackjackRepositoryTournaments"
tournament_entries = "_BlackjackRepositoryTournamentEntries"
tournament_play = "_BlackjackRepositoryTournamentPlay"
config_store = "_BlackjackRepositoryConfigStore"

[blackjack_repository.topics]
hands = "现金局手牌的生命周期与动作"
settlement = "手牌结算与超时结算"
jackpot = "幸运奖池"
retention = "连败救济、周返水与游标"
wallet = "争霸赛余额"
stats = "统计"
tournaments = "赛事的管理、报名、状态流转与查询"
tournament_entries = "参赛记录、排名与一致性查询"
tournament_play = "锦标赛手牌与赛事结算"
config_store = "配置行的读写"

