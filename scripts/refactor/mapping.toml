# 按子主题拆分后的 repository 组合类（design D1）。verify.py 用它把搬移后的类成员
# 按“定义类”归位，而不是靠 part_<n> 命名猜测；拆出的 mixin 必须真实存在。
[repository_mixins]
"app.domains.blackjack.repository" = [
    "_BlackjackRepositoryImplementation",
    "_BlackjackRepositoryHands",
    "_BlackjackRepositorySettlement",
    "_BlackjackRepositoryJackpot",
    "_BlackjackRepositoryRetention",
    "_BlackjackRepositoryWallet",
    "_BlackjackRepositoryStats",
    "_BlackjackRepositoryTournaments",
    "_BlackjackRepositoryTournamentEntries",
    "_BlackjackRepositoryTournamentPlay",
    "_BlackjackRepositoryConfigStore",
]
"app.domains.gift_pack.repository" = [
    "_GiftPackRepositoryConditions",
    "_GiftPackRepositoryRewards",
    "_GiftPackRepositoryPacks",
    "_GiftPackRepositoryClaims",
    "_GiftPackRepositoryNotices",
]
"app.domains.prediction.repository" = [
    "PredictionRepository",
    "_PredictionRepositoryMarkets",
    "_PredictionRepositoryBets",
    "_PredictionRepositorySettlement",
    "_PredictionRepositoryAnalytics",
]

