<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Emby 浅绿色主题渐变 - 创世之光 -->
    <radialGradient id="genesisGradient" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#9CCC65;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#7CB342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#689F38;stop-opacity:1" />
    </radialGradient>
    
    <!-- 浅绿色边框渐变 -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#AED581;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7CB342;stop-opacity:1" />
    </linearGradient>
    
    <!-- 星辰光芒渐变 -->
    <radialGradient id="starGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#C5E1A5;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#9CCC65;stop-opacity:0" />
    </radialGradient>
    
    <!-- 高光效果 -->
    <radialGradient id="highlight" cx="40%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- 内阴影效果 -->
    <radialGradient id="innerShadow" cx="50%" cy="50%">
      <stop offset="70%" style="stop-color:#9CCC65;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#689F38;stop-opacity:0.3" />
    </radialGradient>
    
    <!-- 文字渐变 -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DCEDC8;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 脉冲动画 -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8">
        <animate attributeName="stop-opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#9CCC65;stop-opacity:0" />
    </radialGradient>
    
    <!-- E 字母发光效果 -->
    <filter id="letterGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外圈阴影 -->
  <circle cx="60" cy="60" r="56" fill="rgba(0,0,0,0.2)" filter="url(#shadow)"/>
  
  <!-- 主圆形背景 -->
  <circle cx="60" cy="60" r="54" fill="url(#genesisGradient)" stroke="url(#borderGradient)" stroke-width="3"/>
  
  <!-- 内阴影 -->
  <circle cx="60" cy="60" r="51" fill="url(#innerShadow)"/>
  
  <!-- 高光层 -->
  <ellipse cx="55" cy="45" rx="35" ry="25" fill="url(#highlight)" opacity="0.6"/>
  
  <!-- 创世星辰背景 - 八芒星 -->
  <g transform="translate(60, 60)" opacity="0.3">
    <path d="M 0,-45 L 5,-15 L 32,-32 L 15,-5 L 45,0 L 15,5 L 32,32 L 5,15 L 0,45 L -5,15 L -32,32 L -15,5 L -45,0 L -15,-5 L -32,-32 L -5,-15 Z" 
          fill="#FFFFFF" opacity="0.5"/>
  </g>
  
  <!-- 中心 Emby 官方 Logo -->
  <!-- 外圈光晕 -->
  <circle cx="60" cy="60" r="32" fill="url(#starGlow)" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Emby Logo 主体 -->
  <g transform="translate(60, 60)">
    <!-- 绿色菱形背景 (旋转的圆角矩形) -->
    <rect x="-20" y="-20" width="40" height="40" rx="5" fill="#52B54B" transform="rotate(45)" />
    <!-- 白色播放按钮 (三角形) -->
    <path d="M -6,-10 L 10,0 L -6,10 Z" fill="#FFFFFF" />
  </g>
  
  <!-- Logo 外圈装饰 -->
  <circle cx="60" cy="60" r="26" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  
  <!-- 脉冲光环效果 -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#pulseGlow)" stroke-width="2" opacity="0.6"/>
  
  <!-- 创世光芒 - 四道主光芒 -->
  <g transform="translate(60, 60)" opacity="0.7">
    <!-- 上 -->
    <path d="M -1,-26 L 0,-48 L 1,-26 Z" fill="#FFFFFF" opacity="0.8"/>
    <!-- 右 -->
    <path d="M 26,-1 L 48,0 L 26,1 Z" fill="#FFFFFF" opacity="0.8"/>
    <!-- 下 -->
    <path d="M 1,26 L 0,48 L -1,26 Z" fill="#FFFFFF" opacity="0.8"/>
    <!-- 左 -->
    <path d="M -26,1 L -48,0 L -26,-1 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
  
  <!-- 次级光芒 - 四个对角 -->
  <g transform="translate(60, 60)" opacity="0.5">
    <path d="M -18,-18 L -34,-34 L -17,-19 Z" fill="#A5D6A7" opacity="0.7"/>
    <path d="M 18,-18 L 34,-34 L 19,-17 Z" fill="#A5D6A7" opacity="0.7"/>
    <path d="M 18,18 L 34,34 L 17,19 Z" fill="#A5D6A7" opacity="0.7"/>
    <path d="M -18,18 L -34,34 L -19,17 Z" fill="#A5D6A7" opacity="0.7"/>
  </g>
  
  <!-- 装饰性小星星 -->
  <g opacity="0.9">
    <circle cx="25" cy="30" r="2" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="35" r="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88" cy="85" r="2" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="90" r="1.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 底部文字 "创世" -->
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        text-anchor="middle" fill="url(#textGradient)" stroke="#689F38" stroke-width="0.5">
    创世
  </text>
  
  <!-- 顶部小标 "GENESIS" -->
  <text x="60" y="18" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
        text-anchor="middle" fill="#FFFFFF" opacity="0.9">
    GENESIS
  </text>
  
  <!-- 外圈装饰线条 -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#7CB342" stroke-width="0.5" opacity="0.3"/>
</svg>
