<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 金色渐变 - 主背景 -->
    <radialGradient id="goldGradient" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#FFF4D6;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </radialGradient>
    
    <!-- 深金色边框渐变 -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
    
    <!-- 高光效果 -->
    <radialGradient id="highlight" cx="40%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- 内阴影效果 -->
    <radialGradient id="innerShadow" cx="50%" cy="50%">
      <stop offset="70%" style="stop-color:#FFD700;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:0.3" />
    </radialGradient>
    
    <!-- 文字渐变 -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5C2E0F;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外层阴影 -->
  <circle cx="60" cy="61" r="54" fill="#000000" opacity="0.15" filter="url(#shadow)"/>
  
  <!-- 主圆形背景 -->
  <circle cx="60" cy="60" r="54" fill="url(#goldGradient)" stroke="url(#borderGradient)" stroke-width="3"/>
  
  <!-- 内阴影层 -->
  <circle cx="60" cy="60" r="51" fill="url(#innerShadow)" opacity="0.5"/>
  
  <!-- 高光层 -->
  <ellipse cx="50" cy="45" rx="35" ry="30" fill="url(#highlight)" opacity="0.7"/>
  
  <!-- 装饰圆环 -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#DAA520" stroke-width="0.5" opacity="0.6"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#FFE4B5" stroke-width="0.3" opacity="0.8"/>
  
  <!-- 四颗星星装饰 - 上下左右对称分布 -->
  <g opacity="0.9" filter="url(#glow)">
    <!-- 顶部星星 -->
    <g transform="translate(60, 15)">
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" 
               fill="#FFF8DC" stroke="#DAA520" stroke-width="0.8"/>
    </g>
    
    <!-- 右侧星星 -->
    <g transform="translate(105, 60)">
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" 
               fill="#FFF8DC" stroke="#DAA520" stroke-width="0.8"/>
    </g>
    
    <!-- 底部星星 -->
    <g transform="translate(60, 105)">
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" 
               fill="#FFF8DC" stroke="#DAA520" stroke-width="0.8"/>
    </g>
    
    <!-- 左侧星星 -->
    <g transform="translate(15, 60)">
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" 
               fill="#FFF8DC" stroke="#DAA520" stroke-width="0.8"/>
    </g>
  </g>
  
  <!-- 数字 4 - 添加阴影和渐变 -->
  <text x="60" y="68" font-family="'Arial Black', 'Microsoft YaHei', sans-serif" 
        font-size="48" font-weight="bold" 
        fill="url(#textGradient)" text-anchor="middle" 
        filter="url(#shadow)">4</text>
  
  <!-- 数字高光 -->
  <text x="60" y="68" font-family="'Arial Black', 'Microsoft YaHei', sans-serif" 
        font-size="48" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle" 
        opacity="0.3" transform="translate(-1,-1)">4</text>
  
  <!-- 周年文字 -->
  <text x="60" y="92" font-family="'Microsoft YaHei', 'SimHei', sans-serif" 
        font-size="12" font-weight="bold" letter-spacing="2"
        fill="url(#textGradient)" text-anchor="middle" 
        filter="url(#shadow)">周年</text>
  
  <!-- 底部装饰线 -->
  <g opacity="0.8">
    <path d="M 25,88 Q 35,86 45,88" stroke="#B8860B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 75,88 Q 85,86 95,88" stroke="#B8860B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="88" r="1.5" fill="#DAA520"/>
    <circle cx="98" cy="88" r="1.5" fill="#DAA520"/>
  </g>
  
  <!-- 边缘高光 -->
  <circle cx="60" cy="60" r="55.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
  <circle cx="60" cy="60" r="53.5" fill="none" stroke="#8B6914" stroke-width="0.5" opacity="0.3"/>
</svg>
