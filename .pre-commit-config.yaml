repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.9
    hooks:
      # Run the linter.
      - id: ruff
        name: ruff linter
      - id: ruff
        name: ruff sorter
        description: "Run 'ruff' for extremely fast Python imports sorting"
        args: [ --select, I, --fix ]
      # Run the formatter.
      - id: ruff-format
        name: ruff formater
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter architecture contracts
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: architecture-tests
        name: architecture baseline tests
        entry: .venv/bin/python -m pytest tests/architecture -q
        language: system
        pass_filenames: false
        always_run: true
