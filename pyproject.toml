[project]
name = "pmsmanagebot"
version = "0.7.7"
description = "Telegram bot for managing Plex/Emby media servers with WebApp support"
authors = [
    { name = "WithdewHua", email = "i@10101.io" }
]
dependencies = [
    "plexapi>=4.13.0",
    "pydantic-settings>=2.7.0",
    "python-telegram-bot>=20.0a2",
    "redis>=5.2.1",
    "requests==2.28.0",
    "urllib3==1.26.9",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.2.0",
    "pydantic[email]>=2.10.4",
    "aiohttp>=3.11.18",
    "filelock>=3.18.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "apscheduler>=3.11.2",
    "pytz>=2026.1.post1",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.optional-dependencies]
postgres = [
    # Plain postgresql:// URLs use psycopg2; postgresql+psycopg:// URLs use psycopg 3.
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.2.0",
]
test = [
    "fakeredis>=2.26.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "import-linter>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# DB operations deliberately log broad failures, and FastAPI dependency injection
# requires Depends/Body calls as parameter defaults.
ignore = ["BLE001", "B008"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level architecture"
type = "layers"
layers = [
    "(app.main)",
    "(app.api) | (app.bot) | (app.schedule) | (app.model_registry) | (app.manage)",
    "(app.subscriptions)",
    "(app.domains) : (app.databases)",
    "(app.transport)",
    "(app.integrations)",
    "(app.core)",
]

[[tool.importlinter.contracts]]
name = "External integration isolation"
type = "forbidden"
source_modules = ["app.integrations"]
forbidden_modules = [
    "app.domains",
    "app.databases",
    "app.api",
    "app.bot",
    "app.transport",
    "sqlalchemy",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Legacy database facade freeze"
type = "protected"
protected_modules = ["app.databases"]
allowed_importers = [
    "app.main", # B1 assembly and B3 scheduler migration






























    "app.schedule", # B3 registry temporarily imports legacy job implementations until 5.5
    "app.domains.accounts.service", # B3 mechanical relocation; audit in 5.6
    "app.domains.blackjack.service", # B3 mechanical relocation; audit in 5.6
    "app.domains.crypto_donation.jobs", # B3 mechanical relocation; audit in 5.6
    "app.domains.custom_lines.service", # B3 mechanical relocation; audit in 5.6
    "app.domains.invitation.service", # B3 mechanical relocation; audit in 5.6
    "app.domains.lines.jobs", # B3 mechanical relocation; audit in 5.6
    "app.domains.traffic.jobs", # B3 mechanical relocation; audit in 5.6
    "app.domains.watch_rewards.service", # B3 mechanical relocation; audit in 5.6
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "SQLAlchemy direct use scope"
type = "protected"
protected_modules = ["sqlalchemy"]
allowed_importers = [
    "app.core.db",
    "app.core.kv",
    "app.databases.db",
    "app.domains.*.models",
    "app.domains.*.repository",
    "app.domains.traffic.repository_tx",
    "app.model_registry",
]
ignore_imports = [
    # restructure-backend-architecture: B3 legacy orchestration and utilities
    # restructure-backend-architecture: B2 legacy API handlers






    "app.domains.traffic.jobs -> sqlalchemy", # B3 mechanical db_func relocation; audit in 5.6
]
unmatched_ignore_imports_alerting = "error"
[[tool.importlinter.contracts]]
name = "Database engine import scope"
type = "protected"
protected_modules = ["app.core.db"]
allowed_importers = [
    "app.core.kv",
    "app.core.domain_config",
    "app.core.events",
    "app.core.scheduler", # B3 jobstore migration delegates atomic SQL to core.db only
    "app.domains.*.models",
    "app.domains.*.repository",
    "app.domains.*.repository.*", # generated submodules of large repositories
    "app.domains.traffic.repository_tx",
    "app.model_registry",
    "app.models", # Frozen B2 importer; legacy package deleted in B3
]
as_packages = false
ignore_imports = [
    # restructure-backend-architecture: B3 orchestration/utility migration
    # promote-line-domains: SQL in legacy service
    "app.domains.premium.service -> app.core.db",
    # restructure-backend-architecture: B2 API migration







    "app.domains.traffic.jobs -> app.core.db", # B3 mechanical relocation; audit in 5.6
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domain model import scope"
type = "protected"
protected_modules = ["app.domains.*.models"]
allowed_importers = [
    "app.domains.*.models",
    "app.domains.*.repository",
    "app.domains.*.repository.*",
    "app.domains.traffic.repository_tx",
    "app.model_registry",
]
as_packages = false
ignore_imports = [
    # restructure-backend-architecture: B3 orchestration and utility migration
    # promote-line-domains: remaining Premium/custom-line business logic
    # restructure-backend-architecture: B2 legacy routers








    "app.domains.traffic.jobs -> app.domains.identity.models", # B3 mechanical relocation; audit in 5.6
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Six-tier domain dependencies"
type = "layers"
containers = ["app.domains"]
exhaustive = false # Enable exhaustive coverage once all domains land in B3.
layers = [
    "rankings : reports : (profile)",
    "watch_rewards : gift_pack : (badge_awards) : tg_rebind",
    "(accounts) : invitation : premium : custom_lines : donation : crypto_donation : luckywheel : treasure : prediction : auction : blackjack",
    "badges : lines : traffic : media_access : vaultwarden",
    "credits",
    "identity",
]
ignore_imports = [
    # restructure-backend-architecture: transitional facade composition hides
    # domain-to-domain dependencies; AST cross-domain checks still cover self/db.
    "app.databases.db -> app.domains.invitation.repository",
        "app.databases.db -> app.domains.watch_rewards.repository",





















































]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Acyclic domain siblings"
type = "acyclic_siblings"
ancestors = ["app.domains"]
ignore_imports = [
    # promote-line-domains: traffic consumes the lines-owned catalog interface.
    "app.domains.traffic.repository -> app.domains.lines.catalog",
    # restructure-backend-architecture: transitional facade composition
    "app.databases.db -> app.domains.invitation.repository",
        "app.databases.db -> app.domains.watch_rewards.repository",
]
unmatched_ignore_imports_alerting = "error"
[[tool.importlinter.contracts]]
name = "Domain internal layering"
type = "layers"
containers = ["app.domains.*"]
exhaustive = false
layers = [
    "(router) | (admin_router) | (bot) | (jobs)",
    "(service)",
    "(notifications) | (repository)",
    "(models)",
]
ignore_imports = [
    "app.domains.lines.router -> app.domains.lines.jobs", # B3 mechanical relocation; audit in 5.6
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domain types are pure value modules"
type = "forbidden"
source_modules = ["app.domains.*.types", "app.domains.*.types.*"]
forbidden_modules = [
    "app.domains.*.service",
    "app.domains.*.repository",
    "app.domains.*.repository.*",
    "app.domains.*.router",
    "app.domains.*.admin_router",
    "app.domains.*.bot",
    "app.domains.*.jobs",
    "app.domains.*.notifications",
    "app.domains.*.models",
    "app.domains.*.config",
    "app.domains.*.exceptions",
    "app.core.db",
    "sqlalchemy",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domain rules are pure value computations"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.domains.*.rules",
    "app.domains.*.rules.*",
]
forbidden_modules = [
    "app.domains.*.service",
    "app.domains.*.repository",
    "app.domains.*.repository.*",
    "app.domains.*.router",
    "app.domains.*.admin_router",
    "app.domains.*.bot",
    "app.domains.*.jobs",
    "app.domains.*.notifications",
    "app.core.db",
    "sqlalchemy",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domain entry points do not touch data layer"
type = "forbidden"
source_modules = [
    "app.domains.*.router",
    "app.domains.*.router.*",
    "app.domains.*.admin_router",
    "app.domains.*.bot",
    "app.domains.*.jobs",
    "app.domains.*.notifications",
]
forbidden_modules = [
    "app.core.db",
    "app.databases",
    "sqlalchemy",
    "app.domains.*.repository",
    "app.domains.*.models",
]
allow_indirect_imports = true
ignore_imports = [
    # B2 mechanical relocation retains direct legacy data access.
    "app.domains.traffic.jobs -> sqlalchemy", # B3 mechanical db_func relocation; audit in 5.6
    "app.domains.traffic.jobs -> app.core.db", # B3 mechanical relocation; audit in 5.6
    "app.domains.traffic.jobs -> app.domains.identity.models", # B3 mechanical relocation; audit in 5.6
]
unmatched_ignore_imports_alerting = "error"
