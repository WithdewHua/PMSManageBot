[project]
name = "pmsmanagebot"
version = "0.7.7"
description = "Telegram bot for managing Plex/Emby media servers with WebApp support"
authors = [
    { name = "WithdewHua", email = "i@10101.io" }
]
dependencies = [
    "plexapi>=4.13.0",
    "pydantic-settings>=2.7.0",
    "python-telegram-bot>=20.0a2",
    "redis>=5.2.1",
    "requests==2.28.0",
    "urllib3==1.26.9",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.2.0",
    "pydantic[email]>=2.10.4",
    "aiohttp>=3.11.18",
    "filelock>=3.18.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "apscheduler>=3.11.2",
    "pytz>=2026.1.post1",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.optional-dependencies]
postgres = [
    # Plain postgresql:// URLs use psycopg2; postgresql+psycopg:// URLs use psycopg 3.
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.2.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "import-linter>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# DB operations deliberately log broad failures, and FastAPI dependency injection
# requires Depends/Body calls as parameter defaults.
ignore = ["BLE001", "B008"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level architecture"
type = "layers"
layers = [
    "(app.main)",
    "(app.api) | (app.bot) | (app.schedule) | (app.model_registry)",
    "(app.domains) : (app.databases)",
    "(app.integrations)",
    "(app.core)",
]

[[tool.importlinter.contracts]]
name = "External integration isolation"
type = "forbidden"
source_modules = ["app.integrations"]
forbidden_modules = ["app.domains", "app.databases", "app.api", "app.bot", "sqlalchemy"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"

