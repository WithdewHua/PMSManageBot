[project]
name = "pmsmanagebot"
version = "0.7.7"
description = "Telegram bot for managing Plex/Emby media servers with WebApp support"
authors = [
    { name = "WithdewHua", email = "i@10101.io" }
]
dependencies = [
    "plexapi>=4.13.0",
    "pydantic-settings>=2.7.0",
    "python-telegram-bot>=20.0a2",
    "redis>=5.2.1",
    "requests==2.28.0",
    "urllib3==1.26.9",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.2.0",
    "pydantic[email]>=2.10.4",
    "aiohttp>=3.11.18",
    "filelock>=3.18.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "apscheduler>=3.11.2",
    "pytz>=2026.1.post1",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.optional-dependencies]
postgres = [
    # Plain postgresql:// URLs use psycopg2; postgresql+psycopg:// URLs use psycopg 3.
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.2.0",
]
test = [
    "fakeredis>=2.26.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "import-linter>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# DB operations deliberately log broad failures, and FastAPI dependency injection
# requires Depends/Body calls as parameter defaults.
ignore = ["BLE001", "B008"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level architecture"
type = "layers"
layers = [
    "(app.main)",
    "(app.api) | (app.bot) | (app.schedule) | (app.model_registry) | (app.manage)",
    "(app.subscriptions)",
    "(app.domains)",
    "(app.transport)",
    "(app.integrations)",
    "(app.core)",
]

[[tool.importlinter.contracts]]
name = "External integration isolation"
type = "forbidden"
source_modules = ["app.integrations"]
forbidden_modules = [
    "app.domains",
    "app.api",
    "app.bot",
    "app.transport",
    "sqlalchemy",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"



[[tool.importlinter.contracts]]
name = "SQLAlchemy direct use scope"
type = "protected"
protected_modules = ["sqlalchemy"]
allowed_importers = [
    "app.core.db",
    "app.core.kv",
    "app.domains.*.models",
    "app.domains.*.repository",
    "app.domains.traffic.repository_tx",
    "app.model_registry",
]
ignore_imports = []
unmatched_ignore_imports_alerting = "error"
[[tool.importlinter.contracts]]
name = "Database engine import scope"
type = "protected"
protected_modules = ["app.core.db"]
allowed_importers = [
    "app.core.kv",
    "app.core.domain_config",
    "app.core.events",
    "app.core.scheduler", # B3 jobstore migration delegates atomic SQL to core.db only
    "app.domains.*.models",
    "app.domains.*.repository",
    "app.domains.*.repository.*", # generated submodules of large repositories
    "app.domains.traffic.repository_tx",
    "app.model_registry",
]
as_packages = false
ignore_imports = []
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domain model import scope"
type = "protected"
protected_modules = ["app.domains.*.models"]
allowed_importers = [
    "app.domains.*.models",
    "app.domains.*.repository",
    "app.domains.*.repository.*",
    "app.domains.traffic.repository_tx",
    "app.model_registry",
]
as_packages = false
ignore_imports = []
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Six-tier domain dependencies"
type = "layers"
containers = ["app.domains"]
exhaustive = true
layers = [
    "rankings : reports : (profile)",
    "watch_rewards : gift_pack : (badge_awards) : tg_rebind",
    "(accounts) : invitation : premium : custom_lines : donation : crypto_donation : luckywheel : treasure : prediction : auction : blackjack",
    "badges : lines : traffic : media_access : vaultwarden",
    "credits",
    "identity",
]
ignore_imports = []
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Acyclic domain siblings"
type = "acyclic_siblings"
ancestors = ["app.domains"]
ignore_imports = []
unmatched_ignore_imports_alerting = "error"
[[tool.importlinter.contracts]]
name = "Domain internal layering"
type = "layers"
containers = ["app.domains.*"]
exhaustive = false
layers = [
    "(router) | (admin_router) | (bot) | (jobs)",
    "(service)",
    "(notifications) | (repository)",
    "(models)",
]
ignore_imports = [
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domain types are pure value modules"
type = "forbidden"
source_modules = ["app.domains.*.types", "app.domains.*.types.*"]
forbidden_modules = [
    "app.domains.*.service",
    "app.domains.*.repository",
    "app.domains.*.repository.*",
    "app.domains.*.router",
    "app.domains.*.admin_router",
    "app.domains.*.bot",
    "app.domains.*.jobs",
    "app.domains.*.notifications",
    "app.domains.*.models",
    "app.domains.*.config",
    "app.domains.*.exceptions",
    "app.core.db",
    "sqlalchemy",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domain rules are pure value computations"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.domains.*.rules",
    "app.domains.*.rules.*",
]
forbidden_modules = [
    "app.domains.*.service",
    "app.domains.*.repository",
    "app.domains.*.repository.*",
    "app.domains.*.router",
    "app.domains.*.admin_router",
    "app.domains.*.bot",
    "app.domains.*.jobs",
    "app.domains.*.notifications",
    "app.core.db",
    "sqlalchemy",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domain entry points do not touch data layer"
type = "forbidden"
source_modules = [
    "app.domains.*.router",
    "app.domains.*.router.*",
    "app.domains.*.admin_router",
    "app.domains.*.bot",
    "app.domains.*.jobs",
    "app.domains.*.notifications",
]
forbidden_modules = [
    "app.core.db",
    "sqlalchemy",
    "app.domains.*.repository",
    "app.domains.*.models",
]
allow_indirect_imports = true
